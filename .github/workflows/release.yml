name: Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      prerelease:
        description: "Is this a prerelease?"
        required: false
        type: boolean
        default: false
      release_notes:
        description: "Optional release notes (Markdown). Leave blank to auto-generate."
        required: false
        type: string
        default: ""
      tolerate_republish:
        description: "Allow republishing if version already exists on npm"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    # 🔒 Only allow this workflow to actually run when dispatched from main
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout via deploy key
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.CI_DEPLOY_KEY }}
          fetch-depth: 0

      - name: Ensure up-to-date main & tags
        run: |
          git fetch origin main --tags
          git checkout -B release-tmp origin/main

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Configure git
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@example.com"

      - name: Bump version and compute tag
        id: version
        env:
          VERSION_TYPE: ${{ github.event.inputs.version_type }}
          PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            BUMP_TYPE="pre${VERSION_TYPE}"
          else
            BUMP_TYPE="$VERSION_TYPE"
          fi

          pnpm version "$BUMP_TYPE" --no-git-tag-version

          NEW_VERSION=$(node -p "require('./package.json').version")

          TAG="v$NEW_VERSION"

          if git ls-remote --tags origin "$TAG" | grep -q "$TAG$"; then
            echo "Tag $TAG already exists on origin. Aborting."
            exit 1
          fi

          echo "value=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No files to commit (version already current). Continuing with existing commit."
          else
            git commit -m "chore: release $TAG"
          fi

      - name: Publish to npm (Trusted Publishing)
        env:
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          TOLERATE_REPUBLISH: ${{ github.event.inputs.tolerate_republish }}
        run: |
          # --no-git-checks: publishing from the release-tmp branch, not main.
          PUBLISH_FLAGS="--access public --no-git-checks"

          if [ "$IS_PRERELEASE" = "true" ]; then
            PUBLISH_FLAGS="$PUBLISH_FLAGS --tag next"
          fi

          # pnpm has no --tolerate-republish; skip the publish if the exact
          # version is already on npm.
          PKG="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"

          if [ "$TOLERATE_REPUBLISH" = "true" ] && npm view "$PKG" version >/dev/null 2>&1; then
            echo "$PKG already published; tolerating republish, skipping."
          else
            pnpm publish $PUBLISH_FLAGS
          fi

      - name: Push commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch origin main
          git rebase origin/main
          git tag -f "$TAG"
          git push --force-with-lease origin HEAD:main
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            FLAGS="--prerelease"
          fi

          if [ -n "$RELEASE_NOTES" ]; then
            printf "%s" "$RELEASE_NOTES" > release-notes.txt
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.txt --verify-tag $FLAGS
            rm -f release-notes.txt
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag $FLAGS
          fi
